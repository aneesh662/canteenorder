<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canteen Ordering</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
<header class="topbar"><div class="container d-flex justify-content-between align-items-center"><div><div class="brand">🍽️ CANTEEN</div><div class="subtitle">Fresh food • Easy ordering</div></div><a href="{{ url_for('admin_login') }}" class="btn btn-sm btn-outline-light">Admin</a></div></header>
<main class="container py-4"><section class="hero-card mb-4"><h1>Order Your Food</h1><p class="mb-1">Select food, choose quantity and place your order.</p><small id="menuStatus">Loading menu...</small></section><div id="alertBox"></div><div class="row g-4"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-body"><div class="d-flex flex-wrap gap-2 mb-3"><button class="btn btn-dark category-btn active" data-category="All">All</button><button class="btn btn-outline-dark category-btn" data-category="Breakfast">Breakfast</button><button class="btn btn-outline-dark category-btn" data-category="Lunch">Lunch</button><button class="btn btn-outline-dark category-btn" data-category="Dinner">Dinner</button><button class="btn btn-outline-dark category-btn" data-category="Drinks">Drinks</button><button class="btn btn-outline-dark category-btn" data-category="Snacks">Snacks</button></div><div id="menu" class="row g-3"></div></div></div></div>
<div class="col-lg-4"><div class="card shadow-sm sticky-lg-top cart-card"><div class="card-body"><h4>🛒 Your Order</h4><div class="mb-3"><label class="form-label">Customer Name</label><input id="customerName" class="form-control" placeholder="Enter your name"></div><div class="mb-3"><label class="form-label">Table / Room</label><input id="tableRoom" class="form-control" placeholder="Example: Table 5"></div><div class="mb-3"><label class="form-label">Note</label><textarea id="note" class="form-control" rows="2" placeholder="Optional note"></textarea></div><div id="cart"></div><div class="total-row"><span>Total</span><strong id="cartTotal">₹0</strong></div><button id="placeOrderBtn" class="btn btn-primary w-100 mt-3" onclick="placeOrder()">Place Order</button><button class="btn btn-outline-secondary w-100 mt-2" onclick="clearCartAndFields()">Clear</button><div class="small text-muted mt-3">Your order is sent directly to the canteen system. The canteen will review and accept it.</div></div></div></div></div></main>
<div class="modal fade" id="successModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body text-center p-4"><div class="success-icon">✓</div><h3>Order Placed</h3><p id="successText" class="mb-0"></p><button class="btn btn-dark mt-3" data-bs-dismiss="modal">OK</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
