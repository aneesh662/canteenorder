<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canteen Ordering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="app-header">
  <div class="container py-3">
    <div class="brand-row">
      <div class="brand">
        <span class="brand-icon">🍽️</span>
        <span><strong>Canteen</strong><small>Quick Order</small></span>
      </div>
      <div class="header-actions">
        <a href="{{ url_for('admin_login') }}" class="btn btn-outline-dark btn-sm rounded-pill">⚙️ Admin</a>
        <button class="btn btn-dark rounded-pill" data-bs-toggle="offcanvas" data-bs-target="#cartCanvas">
          🛒 Cart <span id="cartBadge" class="badge text-bg-light">0</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="container pb-5">
  <section class="hero-card mt-3">
    <span class="eyebrow">SELF ORDER</span>
    <h1 id="menuTitle">🍽️ Canteen Menu</h1>
    <p id="menuTime" class="mb-0">Loading...</p>
  </section>

  <div id="categoryChips" class="category-chips my-3"></div>

  <input id="searchInput" class="form-control form-control-lg search-box mb-3" placeholder="🔎 Search food...">

  <div id="itemsGrid" class="row g-3"></div>

  <div id="emptyState" class="empty-state d-none">
    <div>🍽️</div>
    <h5>No items available</h5>
    <p>There are no food items available at this time.</p>
  </div>
</main>

<button class="floating-cart" data-bs-toggle="offcanvas" data-bs-target="#cartCanvas">
  🛒 <span id="floatingCount">0</span> · ₹<span id="floatingTotal">0</span>
</button>

<div class="offcanvas offcanvas-end" tabindex="-1" id="cartCanvas">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">🛒 Your Order</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <div id="cartItems"></div>
    <div class="checkout-box mt-3">
      <label class="form-label">Name</label>
      <input id="customerName" class="form-control mb-2" placeholder="Your name">
      <label class="form-label">Table / Room</label>
      <input id="tableRoom" class="form-control mb-2" placeholder="Table or room number">
      <label class="form-label">Note</label>
      <textarea id="orderNote" class="form-control" rows="2" placeholder="Less spicy, no sugar..."></textarea>
      <div class="total-row"><span>Total</span><strong>₹<span id="cartTotal">0</span></strong></div>
      <button id="sendWhatsapp" class="btn btn-success w-100 btn-lg mt-2">💬 Send Order to WhatsApp</button>
      <button id="clearCart" class="btn btn-outline-secondary w-100 mt-2">Clear Cart</button>
    </div>
  </div>
</div>

<footer class="container text-center py-4 text-muted small">
  Canteen Ordering System · <a href="{{ url_for('admin_login') }}">Admin Login</a>
</footer>

<script>
  const WHATSAPP_NUMBER = "918589900277";
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
