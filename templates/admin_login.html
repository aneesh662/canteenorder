<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - Canteen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-bg">
<div class="container">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-icon">🔐</div>
      <h2>Canteen Admin</h2>
      <p class="text-muted mb-0">Sign in to manage menu items</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <label class="form-label">Username</label>
      <input name="username" class="form-control form-control-lg mb-3" autocomplete="username" required autofocus>
      <label class="form-label">Password</label>
      <input name="password" type="password" class="form-control form-control-lg mb-3" autocomplete="current-password" required>
      <button class="btn btn-dark btn-lg w-100">Login</button>
    </form>
    <a href="{{ url_for('index') }}" class="btn btn-link w-100 mt-2">← Back to Canteen</a>
  </div>
</div>
</body>
</html>
